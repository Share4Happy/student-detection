# ==============================================================================
# Student Detection API - Docker Compose Configuration
# ==============================================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up --build -d
#   docker compose -f docker/docker-compose.yml logs -f
#   docker compose -f docker/docker-compose.yml down
# ==============================================================================

services:
  student-detection-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: student-detection-api:latest
    container_name: student-detection-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount host model directory into container (read-only)
      - ../data/models:/app/data/models:ro
      # Persist Hugging Face cache so Depth Anything V2 weights are downloaded once
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface-cache:
    name: student-detection-huggingface-cache
